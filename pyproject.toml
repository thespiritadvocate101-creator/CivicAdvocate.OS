[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-advocate-os"
version = "0.1.0"
description = "CivicAdvocate.OS platform and deployment pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # Add runtime dependencies here as needed
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
include = ["civic_advocate*", "src*"]
