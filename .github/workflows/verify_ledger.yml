name: Verify and Publish Ledger

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Ed25519 Signature
        run: |
          echo "[*] Verifying cryptographic signature of ledger export..."
          openssl pkeyutl -verify -pubin -inkey docs/public_key.pem -sigfile docs/ledger_export.jsonld.sig -in docs/ledger_export.jsonld
          echo "[+] Signature verification passed successfully."

      - name: Validate SHA-512 Checksum
        run: |
          echo "[*] Verifying SHA-512 checksum..."
          sha512sum -c docs/ledger_export.jsonld.sha512

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
