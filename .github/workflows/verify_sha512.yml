name: SHA-512 Audit Ledger Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Verification Script Execution Permissions
        run: chmod +x ./verify_ledger.sh

      - name: Execute Cryptographic Audit Verification
        run: ./verify_ledger.sh
